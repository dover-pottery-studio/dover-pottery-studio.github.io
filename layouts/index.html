{{ define "main" }}
  <div role="main" class="container">
    <div class="row">
      <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">
        {{ with .Content }}
          <div class="well">
            {{.}}
          </div>
        {{ end }}

        {{ $latestPost := index (first 1 (where site.RegularPages "Type" "in" site.Params.mainSections)) 0 }}
        {{ if $latestPost }}
          <div class="well">
            {{ partial "post_preview.html" $latestPost }}
            <a href="/posts/" class="button">View All News →</a>
          </div>
        {{ end }}
      </div>
    </div>
  </div>
{{ end }}
