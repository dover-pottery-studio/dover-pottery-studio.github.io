<!-- layouts/shortcodes/class-modal.html
     A popup for a single Class Types template: shows the template name
     plus its live upcoming sessions (via the same kilnfire-upcoming-classes
     "list" widget used on the Class List tab). Triggered by intercepting
     clicks on the matching blocks-view card - see initClassTypeModals in
     static/js/main.js. Hidden by default; JS toggles the "is-open" class. -->
{{ $template := .Get "template" }}
{{ $name := .Get "name" }}
<div class="dps-class-modal" id="dps-class-modal-{{ $template }}">
  <div class="dps-class-modal-bg"></div>
  <div class="dps-class-modal-area" role="dialog" aria-modal="true" aria-labelledby="dps-class-modal-title-{{ $template }}">
    <button type="button" class="dps-class-modal-close" aria-label="Close">&times;</button>
    <h3 class="dps-class-modal-title" id="dps-class-modal-title-{{ $template }}">{{ $name }}</h3>
    <div class="kilnfire-upcoming-classes" data-org-id="25" data-view="list" data-template-id="{{ $template }}"></div>
  </div>
</div>
<script src="https://kilnfire.com/classembed.js"></script>
