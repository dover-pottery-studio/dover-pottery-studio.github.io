<!-- layouts/shortcodes/promo-banner.html -->
{{ $title := .Get "title" }}
{{ $text := .Get "text" }}
{{ $buttonText := .Get "buttonText" | default "Learn More" }}
{{ $buttonUrl := .Get "buttonUrl" }}
<div class="promo-banner">
  {{ with $title }}<h3>{{ . }}</h3>{{ end }}
  {{ with $text }}<p>{{ . }}</p>{{ end }}
  {{ with $buttonUrl }}<a href="{{ . }}" class="button" target="_blank" rel="noopener noreferrer">{{ $buttonText }}</a>{{ end }}
</div>
